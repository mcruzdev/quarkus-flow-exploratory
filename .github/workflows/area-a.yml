name: Area A - Local Developer Workflow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  area-a:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Area A automation
        run: ./scripts/areas/area-a.sh

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: area-a-evidence-${{ github.run_id }}
          path: evidence/area-a
          if-no-files-found: warn
          retention-days: 14
